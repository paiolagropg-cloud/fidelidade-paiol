<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Fidelidade Paiol e Rancho Novo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:15px}
.header{background:#fff;border-bottom:1px solid #e0e0d8;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:16px;font-weight:600}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge.ok{background:#e8f9f0;color:#0F6E56}
.badge.err{background:#fff5f5;color:#a32d2d}
.badge.wait{background:#fffbe6;color:#7a5c00}
.tabs{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #e8e8e0;overflow-x:auto}
.tab{padding:6px 14px;border:1px solid #d0d0c8;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;color:#666;white-space:nowrap;flex-shrink:0}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.page{display:none;padding:14px}
.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e8e8e0}
.kpi-l{font-size:11px;color:#888;margin-bottom:2px}
.kpi-v{font-size:22px;font-weight:700}
.card{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.stitle{font-size:14px;font-weight:600;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px}
.f label{font-size:11px;color:#666;font-weight:500}
.f input,.f select{padding:8px 10px;border:1px solid #d0d0c8;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;width:100%;outline:none}
.f input:focus,.f select:focus{border-color:#1a1a1a}
.btn{padding:8px 14px;border:1px solid #d0d0c8;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#1a1a1a;font-weight:500}
.btn.p{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn.g{border-color:#1D9E75;color:#0F6E56;background:#f0faf5}
.btn.r{border-color:#e24b4a;color:#a32d2d;font-size:12px;padding:5px 9px;background:#fff5f5}
.clist{display:flex;flex-direction:column;gap:8px}
.ci{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:12px 13px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:6px}
.cn{font-weight:600;font-size:14px}
.cp{font-size:12px;color:#666;margin-top:1px}
.tg{font-size:11px;padding:2px 7px;border-radius:20px;margin-top:2px;display:inline-block;margin-right:2px}
.tg.rc{background:#f0f0e8;color:#555;cursor:pointer}
.tg.ct{background:#e8f0fe;color:#1a56cc}
.pb{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;background:#f0f0e8;color:#555}
.pb.prize{background:#e8f9f0;color:#0F6E56;border:1px solid #1D9E75}
.bar{background:#f0f0e8;border-radius:99px;height:5px;overflow:hidden;margin:6px 0}
.barf{height:5px;border-radius:99px;background:#1a1a1a;transition:width .3s}
.ar{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.hi{font-size:11px;padding:4px 0;border-bottom:1px solid #f0f0e8;display:flex;justify-content:space-between;color:#888}
.hi:last-child{border-bottom:none}
.empty{text-align:center;padding:24px;color:#aaa;font-size:13px}
.loading{text-align:center;padding:24px;color:#888;font-size:13px}
.sb{margin-bottom:10px}
.sb input{width:100%;padding:9px 12px;border:1px solid #d0d0c8;border-radius:10px;font-size:14px;background:#fff;outline:none}
.fb{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.fb .btn{font-size:12px;padding:4px 11px;border-radius:20px}
.msg{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:8px;display:none}
.msg.show{display:block}
.msg.s{background:#e8f9f0;color:#0F6E56}
.msg.i{background:#e8f0fe;color:#1a56cc}
.pg{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:14px}
.mo.open{display:flex}
.md{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.md h3{font-size:15px;font-weight:600;margin-bottom:10px}
.wa{background:#e8f9f0;border-radius:10px;padding:12px;font-size:13px;color:#1a4a30;line-height:1.65;margin:10px 0;white-space:pre-wrap;border:1px solid #c0e8d0;word-break:break-word}
.ma{display:flex;gap:7px;margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <h1>Cartao Fidelidade - Paiol e Rancho</h1>
  <span class="badge wait" id="bdg">Carregando...</span>
</div>
<div class="tabs">
  <button class="tab active" onclick="ir('painel')">Painel</button>
  <button class="tab" onclick="ir('clientes')">Clientes</button>
  <button class="tab" onclick="ir('registrar')">Registrar</button>
  <button class="tab" onclick="ir('premios')">Premios</button>
  <button class="tab" onclick="ir('crm')">CRM</button>
</div>
<div id="pg-painel" class="page active">
  <div class="grid" id="kpis"><div class="loading">Carregando...</div></div>
  <div class="card"><p class="stitle">Premios para resgatar</p><div id="ls-premios" class="clist"></div></div>
  <div class="card"><p class="stitle">Proximos do premio (faltam 1-2)</p><div id="ls-quase" class="clist"></div></div>
</div>
<div id="pg-clientes" class="page">
  <div class="sb"><input type="text" id="busca" placeholder="Buscar nome, telefone ou racao..." oninput="pgAtual=1;listarClientes()"></div>
  <div class="fb" id="filtros">
    <button class="btn active" onclick="filtrar('todos',this)">Todos</button>
    <button class="btn" onclick="filtrar('Paiol',this)">Cel. Paiol</button>
    <button class="btn" onclick="filtrar('Rancho',this)">Cel. Rancho</button>
    <button class="btn" onclick="filtrar('Daniel',this)">Cel. Daniel</button>
    <button class="btn" onclick="filtrar('Matheus',this)">Cel. Matheus</button>
  </div>
  <div id="ls-clientes" class="clist"><div class="loading">Carregando...</div></div>
  <div class="pg" id="paginacao"></div>
</div>
<div id="pg-registrar" class="page">
  <div class="card">
    <p class="stitle">Novo cliente</p>
    <div class="row">
      <div class="f"><label>Nome</label><input id="rn" type="text" placeholder="Joao da Silva"></div>
      <div class="f"><label>WhatsApp</label><input id="rt" type="tel" placeholder="(42) 99999-9999"></div>
    </div>
    <div class="row">
      <div class="f"><label>Salvo no celular</label>
        <select id="rc">
          <option value="Paiol">Celular da Paiol</option>
          <option value="Rancho">Celular da Rancho</option>
          <option value="Daniel">Celular do Daniel</option>
          <option value="Matheus">Celular do Matheus</option>
        </select>
      </div>
      <div class="f"><label>Racao</label><input id="rr" type="text" placeholder="Special Dog 15kg"></div>
    </div>
    <div class="row">
      <div class="f"><label>Cartao</label>
        <select id="rtp">
          <option value="10">10 pacotes - 11 com 50% off</option>
          <option value="20">20 pacotes - 21 gratis</option>
        </select>
      </div>
    </div>
    <button class="btn p" onclick="novoCliente()">Cadastrar</button>
    <div id="msg-cad" class="msg"></div>
  </div>
  <div class="card">
    <p class="stitle">Registrar compra</p>
    <div class="row">
      <div class="f"><label>Buscar cliente</label><input id="cb" type="text" placeholder="Nome ou telefone..." oninput="buscaCompra()"></div>
    </div>
    <div class="row">
      <div class="f"><label>Data</label><input id="cd" type="date"></div>
      <div class="f"><label>Qtd pacotes</label><input id="cq" type="number" min="1" max="20" value="1"></div>
    </div>
    <div id="ls-compra" style="margin-bottom:8px"></div>
    <div id="msg-cmp" class="msg"></div>
  </div>
</div>
<div id="pg-premios" class="page">
  <div class="card">
    <p class="stitle">Resgatar premio</p>
    <div class="row"><div class="f"><label>Buscar cliente</label><input id="pb2" type="text" placeholder="Nome ou telefone..." oninput="buscaPremio()"></div></div>
    <div id="ls-premio" class="clist"></div>
    <div id="msg-prm" class="msg"></div>
  </div>
</div>
<div id="pg-crm" class="page">
  <div class="card">
    <p class="stitle">Radar de recompra</p>
    <div class="fb" id="crm-filtros">
      <button class="btn active" onclick="crmFiltrar('todos',this)">Todos</button>
      <button class="btn" onclick="crmFiltrar('verde',this)">Verde - Em dia</button>
      <button class="btn" onclick="crmFiltrar('amarelo',this)">Atencao</button>
      <button class="btn" onclick="crmFiltrar('vermelho',this)">Em risco</button>
      <button class="btn" onclick="crmFiltrar('perdido',this)">Perdido</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px">
      Verde ate <input id="d1" type="number" value="20" style="width:42px;padding:2px 6px;border:1px solid #d0d0c8;border-radius:6px;font-size:12px"> dias
      Atencao ate <input id="d2" type="number" value="35" style="width:42px;padding:2px 6px;border:1px solid #d0d0c8;border-radius:6px;font-size:12px"> dias
      Risco ate <input id="d3" type="number" value="60" style="width:42px;padding:2px 6px;border:1px solid #d0d0c8;border-radius:6px;font-size:12px"> dias
      <button class="btn p" style="font-size:12px;padding:5px 10px" onclick="renderCRM()">Aplicar</button>
    </div>
    <div class="grid" id="crm-kpis"></div>
    <div id="ls-crm" class="clist"></div>
  </div>
</div>
<div id="modal" class="mo">
  <div class="md">
    <h3 id="mo-titulo"></h3>
    <div class="wa" id="mo-corpo"></div>
    <div class="ma">
      <button class="btn g" onclick="copiar()">Copiar mensagem</button>
      <button class="btn" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>

async function init() {
  try {
    bdg('Conectando...', 'wait');
    await signInAnonymously(auth);
    bdg('Carregando...', 'wait');
    await sincronizar();
    const ids = new Set(C.map(c => c.id));
    const faltam = DADOS.filter(c => !ids.has(c.id));
    if (faltam.length > 0) {
      bdg('Importando ' + faltam.length + '...', 'wait');
      const LOTE = 400;
      for (let i = 0; i < faltam.length; i += LOTE) {
        const bat = writeBatch(db);
        faltam.slice(i, i + LOTE).forEach(c => bat.set(doc(db, 'clientes', c.id), c));
        await bat.commit();
      }
      await sincronizar();
    }
    bdg('Online', 'ok');
    renderPainel();
    listarClientes();
  } catch(e) {
    bdg('Erro: ' + e.message, 'err');
    console.error(e);
  }
}

async function sincronizar() {
  const snap = await getDocs(col);
  C = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function getC(id) { return C.find(x => x.id === id); }
function getIdx(id) { return C.findIndex(x => x.id === id); }

function ir(pag) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('pg-' + pag).classList.add('active');
  const tabs = ['painel','clientes','registrar','premios','crm'];
  const i = tabs.indexOf(pag);
  if (i >= 0) document.querySelectorAll('.tab')[i].classList.add('active');
  if (pag === 'painel') renderPainel();
  if (pag === 'clientes') listarClientes();
  if (pag === 'crm') renderCRM();
}

function filtrar(f, el) {
  filtroAtivo = f; pgAtual = 1;

  listarClientes();
}

function kpi(l, v) {
  return `<div class="kpi"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div></div>`;
}

function card(c, modo) {
  const meta = parseInt(c.tipo || '10');
  const pct = Math.min(100, Math.round(c.pontos / meta * 100));
  const pronto = c.pontos >= meta;
  const hist = (c.historico || []).slice(-2).reverse()
    .map(h => `<div class="hi"><span>${h.tipo === 'compra' ? '+1 pacote' : 'Premio'}</span><span>${h.data}</span></div>`)
    .join('');
  let acoes = '';
  if (modo === 'compra') {
    acoes = `<button class="btn g" data-action="compra" data-id="${c.id}">+1 pacote</button>`;
  } else if (modo === 'premio') {
    acoes = pronto
      ? `<button class="btn g" data-action="resgatar" data-id="${c.id}">Resgatar</button>`
      : `<span style="font-size:12px;color:#aaa">Faltam ${meta - c.pontos}</span>`;
  } else {
    acoes = `<button class="btn g" data-action="compra" data-id="${c.id}">+1</button> `
      + `<button class="btn" data-action="wa" data-id="${c.id}" style="font-size:12px;padding:5px 9px">WA</button> `
      + `<button class="btn r" data-action="excluir" data-id="${c.id}">Lixo</button>`;
  }
  return `<div class="ci">
    <div class="ch"><div>
      <div class="cn">${c.nome}</div>
      <div class="cp">${c.tel}</div>
      <span class="tg rc" data-action="racao" data-id="${c.id}">${c.racao || '+ racao'} E</span>
      <span class="tg ct">📱 ${c.contato || 'Paiol'}</span>
    </div>
    <span class="pb${pronto ? ' prize' : ''}">${pronto ? 'PREMIO!' : c.pontos + '/' + meta}</span>
    </div>
    <div class="bar"><div class="barf" style="width:${pct}%"></div></div>
    ${hist ? `<div style="margin-top:4px">${hist}</div>` : ''}
    <div class="ar">${acoes}</div>
  </div>`;
}

// Single event delegation for all actions
document.body.addEventListener('click', async function(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === 'compra') await addCompra(id);
  if (action === 'resgatar') await resgatar(id);
  if (action === 'excluir') await excluir(id);
  if (action === 'wa') waCliente(id);
  if (action === 'racao') await editarRacao(id);
  if (action === 'crmwa') abrirCRM(id);
});

function renderPainel() {
  const cel = { Paiol: 0, Rancho: 0, Daniel: 0, Matheus: 0 };
  C.forEach(c => { if (cel[c.contato] !== undefined) cel[c.contato]++; });
  const prontos = C.filter(c => c.pontos >= parseInt(c.tipo || '10'));
  document.getElementById('kpis').innerHTML =
    kpi('Total', C.length) + kpi('Premios', prontos.length) +
    kpi('Paiol', cel.Paiol) + kpi('Rancho', cel.Rancho) +
    kpi('Daniel', cel.Daniel) + kpi('Matheus', cel.Matheus);
  document.getElementById('ls-premios').innerHTML = prontos.length
    ? prontos.map(c => card(c, 'lista')).join('') : '<div class="empty">Nenhum premio.</div>';
  const quase = C.filter(c => { const m = parseInt(c.tipo || '10'); return c.pontos >= m - 2 && c.pontos < m; });
  document.getElementById('ls-quase').innerHTML = quase.length
    ? quase.map(c => card(c, 'lista')).join('') : '<div class="empty">Ninguem proximo.</div>';
}

function listarClientes() {
  const q = (document.getElementById('busca')?.value || '').trim().toLowerCase();
  const lista = C.filter(c => {
    if (filtroAtivo !== 'todos' && (c.contato || '') !== filtroAtivo) return false;
    if (q && !c.nome.toLowerCase().includes(q) && !c.tel.includes(q) && !(c.racao || '').toLowerCase().includes(q)) return false;
    return true;
  });
  const pags = Math.max(1, Math.ceil(lista.length / POR_PAG));
  if (pgAtual > pags) pgAtual = pags;
  const slice = lista.slice((pgAtual - 1) * POR_PAG, pgAtual * POR_PAG);
  document.getElementById('ls-clientes').innerHTML = slice.length
    ? slice.map(c => card(c, 'lista')).join('') : '<div class="empty">Nenhum cliente.</div>';
  let pg = '';
  if (pags > 1) {
    pg = `<span style="font-size:12px;color:#888">${lista.length} clientes</span>`;
    if (pgAtual > 1) pg += ` <button class="btn" onclick="pgAtual--;listarClientes()">Anterior</button>`;
    pg += ` <button class="btn active">${pgAtual}/${pags}</button>`;
    if (pgAtual < pags) pg += ` <button class="btn" onclick="pgAtual++;listarClientes()">Proximo</button>`;
  }
  document.getElementById('paginacao').innerHTML = pg;
}

async function novoCliente() {
  const nome = document.getElementById('rn').value.trim();
  const tel = document.getElementById('rt').value.trim();
  const msg = document.getElementById('msg-cad');
  if (!nome || !tel) { mostrarMsg(msg, 'Preencha nome e WhatsApp.', 'i'); return; }
  const novo = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    nome, tel,
    contato: document.getElementById('rc').value,
    racao: document.getElementById('rr').value.trim(),
    tipo: document.getElementById('rtp').value,
    pontos: 0, historico: [], resgates: 0,

  };
  try {
    await setDoc(doc(db, 'clientes', novo.id), novo);

async function addCompra(id) {
  const idx = getIdx(id); if (idx < 0) return;
  const c = C[idx];
  const meta = parseInt(c.tipo || '10');
  const di = document.getElementById('cd').value;
  const data = di ? di.split('-').reverse().join('/') : new Date().toLocaleDateString('pt-BR');
  const qtd = Math.max(1, Math.min(20, parseInt(document.getElementById('cq').value) || 1));
  const upd = { ...c, historico: [...(c.historico || [])] };
  let n = 0;
  for (let i = 0; i < qtd; i++) {
    if (upd.pontos >= meta) { if (i === 0) { alert('Premio pendente! Resgate primeiro.'); return; } break; }
    upd.pontos++;
    upd.historico.push({ data, tipo: 'compra' });
    n++;
  }
  try {
    await setDoc(doc(db, 'clientes', id), upd);
    C[idx] = upd;
    buscaCompra();
    renderPainel();
    mostrarMsg(document.getElementById('msg-cmp'), '+' + n + ' para ' + c.nome + '. Saldo: ' + upd.pontos + '/' + meta, 's');
    abrirWA(upd, 'compra');
  } catch(e) { alert('Erro: ' + e.message); }
}

async function resgatar(id) {
  const idx = getIdx(id); if (idx < 0) return;
  const c = C[idx];
  const meta = parseInt(c.tipo || '10');
  if (c.pontos < meta) { alert('Ainda nao atingiu a meta.'); return; }
  const upd = { ...c, pontos: 0, resgates: (c.resgates || 0) + 1,
    historico: [...(c.historico || []), { data: new Date().toLocaleDateString('pt-BR'), tipo: 'resgate' }] };
  try {
    await setDoc(doc(db, 'clientes', id), upd);
    C[idx] = upd;
    buscaPremio();
    renderPainel();
    mostrarMsg(document.getElementById('msg-prm'), 'Premio resgatado para ' + c.nome + '!', 's');
    abrirWA(upd, 'resgate');
  } catch(e) { alert('Erro: ' + e.message); }
}

async function excluir(id) {
  const idx = getIdx(id); if (idx < 0) return;
  if (!confirm('Remover ' + C[idx].nome + '?')) return;
  try {
    bdg('Removendo...', 'wait');
    await deleteDoc(doc(db, 'clientes', id));
    C.splice(idx, 1);
    bdg('Online', 'ok');
    listarClientes();
    renderPainel();
  } catch(e) {
    bdg('Online', 'ok');
    alert('Erro ao remover: ' + e.message);
  }
}

async function editarRacao(id) {
  const idx = getIdx(id); if (idx < 0) return;
  const nova = prompt('Racao de ' + C[idx].nome + ':', C[idx].racao || '');
  if (nova === null) return;
  const upd = { ...C[idx], racao: nova.trim() };
  try {
    await setDoc(doc(db, 'clientes', id), upd);
    C[idx] = upd;
    listarClientes();
  } catch(e) { alert('Erro: ' + e.message); }
}

}

function buscaPremio() {
  const q = document.getElementById('pb2').value.trim().toLowerCase();
  const el = document.getElementById('ls-premio');
  if (!q) { el.innerHTML = ''; return; }
  const res = C.filter(c => c.nome.toLowerCase().includes(q) || c.tel.includes(q));
  el.innerHTML = res.length ? res.slice(0, 5).map(c => card(c, 'premio')).join('') : '<p style="color:#aaa;font-size:13px;padding:6px 0">Nenhum encontrado.</p>';
}

function diasDesde(d) {
  if (!d) return 9999;
  const p = d.split('/'); if (p.length < 3) return 9999;
  const r = Math.floor((Date.now() - new Date(+p[2], +p[1]-1, +p[0])) / 86400000);
  return isNaN(r) ? 9999 : r;
}
function ultimaCompra(c) {
  const h = (c.historico || []).filter(x => x.tipo === 'compra');
  return h.length ? h[h.length-1].data : null;
}
function freqMedia(c) {
  const h = (c.historico || []).filter(x => x.tipo === 'compra');
  if (h.length < 2) return null;
  const ds = h.map(x => { const p = x.data.split('/'); return new Date(+p[2], +p[1]-1, +p[0]).getTime(); }).sort((a,b) => a-b);
  let t = 0; for (let i = 1; i < ds.length; i++) t += ds[i] - ds[i-1];
  return Math.round(t / (ds.length-1) / 86400000);
}
function corCRM(dias, d1, d2, d3) {
  if (dias === 9999) return 'perdido';
  if (dias <= d1) return 'verde';
  if (dias <= d2) return 'amarelo';
  if (dias <= d3) return 'vermelho';
  return 'perdido';
}

function renderCRM() {
  const d1 = +document.getElementById('d1').value||20;
  const d2 = +document.getElementById('d2').value||35;
  const d3 = +document.getElementById('d3').value||60;
  const bg = { verde:'#e8f9f0', amarelo:'#fffbe6', vermelho:'#fff5f5', perdido:'#f0f0f0' };
  const tx = { verde:'#0F6E56', amarelo:'#7a5c00', vermelho:'#a32d2d', perdido:'#666' };
  const ic = { verde:'Verde', amarelo:'Atencao', vermelho:'Risco', perdido:'Perdido' };
  const dados = C.map(c => ({
    ...c, dias: diasDesde(ultimaCompra(c)), freq: freqMedia(c),
    total: (c.historico||[]).filter(h=>h.tipo==='compra').length
  })).filter(c => c.total > 0);
  dados.forEach(c => { c.cor = corCRM(c.dias, d1, d2, d3); });
  const cnt = { verde:0, amarelo:0, vermelho:0, perdido:0 };
  dados.forEach(c => cnt[c.cor]++);
  document.getElementById('crm-kpis').innerHTML =
    kpi('Verde', cnt.verde) + kpi('Atencao', cnt.amarelo) +
    kpi('Risco', cnt.vermelho) + kpi('Perdido', cnt.perdido);
  dados.forEach(c => { crmMsgs[c.id] = msgCRM(c, c.cor); });
  const fil = (crmFiltroAtivo === 'todos' ? dados : dados.filter(c => c.cor === crmFiltroAtivo)).sort((a,b) => b.dias-a.dias);
  if (!fil.length) { document.getElementById('ls-crm').innerHTML = '<div class="empty">Nenhum cliente.</div>'; return; }
  document.getElementById('ls-crm').innerHTML = fil.map(c => {
    const dt = c.dias===9999?'Sem compras':c.dias===0?'Hoje':c.dias===1?'Ontem':`Ha ${c.dias} dias`;
    return `<div class="ci">
      <div class="ch"><div>
        <div class="cn">${ic[c.cor]} ${c.nome}</div>
        <div class="cp">${c.tel}</div>
        ${c.racao ? `<span class="tg rc">${c.racao}</span>` : ''}
        <span class="tg ct">📱 ${c.contato||'Paiol'}</span>
      </div>
      <div style="text-align:right">
        <span style="font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;background:${bg[c.cor]};color:${tx[c.cor]};display:block;margin-bottom:3px">${dt}</span>
        <span style="font-size:11px;color:#888">${c.total} compra${c.total!==1?'s':''}</span>
      </div></div>
      <div style="font-size:11px;color:#888;margin:3px 0 7px">${c.freq?`Media: ${c.freq} dias`:'1a compra'} - ${c.pontos}/${c.tipo||10} pts</div>
      <button class="btn g" data-action="crmwa" data-id="${c.id}">Mensagem WA</button>
    </div>`;
  }).join('');
}

function msgCRM(c, cr) {
  const r = c.racao || 'racao';
  const n = c.nome.split(' ')[0];
  const m = {
    verde: `Ola, ${n}!\n\nTudo bem com seu pet?\nA ${r} esta disponivel aqui. Qualquer coisa e so chamar!`,
    amarelo: `Ola, ${n}!\n\nJa faz um tempinho que nao te vemos!\nA ${r} pode estar acabando. Quer que separemos um pacote?`,
    vermelho: `Ola, ${n}!\n\nEstamos com saudade! A ${r} esta no estoque e seu cartao tem ${c.pontos} ponto${c.pontos!==1?'s':''}. Nao perde!`,
    perdido: `Ola, ${n}!\n\nFaz muito tempo que nao te vemos!\nVoce tem ${c.pontos} ponto${c.pontos!==1?'s':''} no cartao esperando. Que tal passar aqui?`
  };
  return m[cr] || m.perdido;
}

function abrirWA(c, tipo) {
  const meta = parseInt(c.tipo||'10');
  const premio = meta===10 ? '50% de desconto no proximo pacote' : 'um pacote gratis';
  const n = c.nome.split(' ')[0];
  let txt = '';
  if (tipo === 'cadastro') {
    txt = `Ola, ${n}!\n\nBem-vindo ao cartao fidelidade!\nA cada ${meta} pacotes voce ganha ${premio}.\nSaldo: 0/${meta} pacotes.\n\nObrigado!`;
  } else if (tipo === 'compra') {
    const f = meta - c.pontos;
    txt = f <= 0
      ? `Ola, ${n}!\n\nCartao completo! Voce ganhou ${premio}!\nNa proxima visita e so avisar.`
      : `Ola, ${n}!\n\nCompra registrada!\nSaldo: ${c.pontos}/${meta}. Faltam ${f} para ganhar ${premio}!\n\nObrigado!`;
  } else {
    txt = `Ola, ${n}!\n\nPremio resgatado! Cartao zerado.\nA cada ${meta} pacotes voce ganha ${premio}.\n\nObrigado!`;
  }
  abrirModal('Copiar para WhatsApp', txt);
}

function waCliente(id) { const c = getC(id); if (c) abrirWA(c, 'compra'); }
function abrirCRM(id) { const c = getC(id); if (!c) return; abrirModal('Mensagem para ' + c.nome, crmMsgs[id] || msgCRM(c, 'verde')); }

function abrirModal(titulo, corpo) {
  document.getElementById('mo-titulo').textContent = titulo;
  document.getElementById('mo-corpo').textContent = corpo;
  document.getElementById('modal').classList.add('open');
}
function fecharModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) fecharModal(); });
function copiar() { navigator.clipboard.writeText(document.getElementById('mo-corpo').textContent).then(fecharModal).catch(() => alert('Copie manualmente.')); }

function mostrarMsg(el, txt, tipo) { el.textContent = txt; el.className = 'msg show ' + tipo; setTimeout(() => el.classList.remove('show'), 4000); }

Object.assign(window, { ir, filtrar, crmFiltrar, listarClientes, renderCRM, novoCliente, buscaCompra, buscaPremio, fecharModal, copiar, pgAtual: 1 });

document.getElementById('cd').value = new Date().toISOString().split('T')[0];
init();

</script>
