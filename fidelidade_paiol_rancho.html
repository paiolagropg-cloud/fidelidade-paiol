<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Fidelidade — Paiol & Rancho Novo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:16px}
.header{background:#fff;border-bottom:1px solid #e0e0d8;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:600}
.sync-badge{font-size:11px;padding:4px 10px;border-radius:20px;background:#e8f9f0;color:#0F6E56;font-weight:500}
.sync-badge.offline{background:#fff5f5;color:#a32d2d}
.sync-badge.syncing{background:#fffbe6;color:#7a5c00}
.tabs{display:flex;gap:6px;padding:12px 16px;background:#fff;border-bottom:1px solid #e8e8e0;flex-wrap:wrap}
.tab{padding:7px 14px;border:1px solid #d0d0c8;border-radius:20px;background:transparent;cursor:pointer;font-size:13px;color:#666;white-space:nowrap}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.screen{display:none;padding:16px}
.screen.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:16px}
.metric{background:#fff;border-radius:10px;padding:12px;border:1px solid #e8e8e0}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:700;color:#1a1a1a}
.card{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:14px;margin-bottom:10px}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px}
.field-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.field label{font-size:12px;color:#666;font-weight:500}

.field input:focus,.field select:focus{border-color:#1a1a1a}
.btn{padding:9px 16px;border:1px solid #d0d0c8;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;color:#1a1a1a;font-weight:500}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-success{border-color:#1D9E75;color:#0F6E56;background:#f0faf5}
.btn-danger{border-color:#e24b4a;color:#a32d2d;font-size:12px;padding:6px 10px;background:#fff5f5}
.client-list{display:flex;flex-direction:column;gap:8px}
.client-item{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:13px 14px}
.client-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.client-name{font-weight:600;font-size:15px}
.client-phone{font-size:13px;color:#666;margin-top:1px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;margin-top:3px;display:inline-block;margin-right:3px}
.tag-racao{background:#f0f0e8;color:#555;cursor:pointer}
.tag-contato{background:#e8f0fe;color:#1a56cc}
.prize-badge{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;background:#f0f0e8;color:#555}
.prize-ready{background:#e8f9f0;color:#0F6E56;border:1px solid #1D9E75}
.bar-bg{background:#f0f0e8;border-radius:99px;height:6px;overflow:hidden;margin:8px 0}
.bar-fill{height:6px;border-radius:99px;background:#1a1a1a;transition:width 0.3s}
.actions-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.history-item{font-size:12px;padding:5px 0;border-bottom:1px solid #f0f0e8;display:flex;justify-content:space-between;color:#888}
.history-item:last-child{border-bottom:none}
.empty{text-align:center;padding:2rem;color:#aaa;font-size:14px}
.loading{text-align:center;padding:2rem;color:#888;font-size:14px}
.search-bar{margin-bottom:12px}
.search-bar input{width:100%;padding:10px 14px;border:1px solid #d0d0c8;border-radius:10px;font-size:14px;background:#fff;outline:none}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1px solid #d0d0c8;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#666}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}
.msg.show{display:block}
.msg-success{background:#e8f9f0;color:#0F6E56}
.msg-info{background:#e8f0fe;color:#1a56cc}
.pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.page-btn{padding:5px 12px;border:1px solid #d0d0c8;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#666}
.page-btn.active{background:#1a1a1a;color:#fff}
.page-info{font-size:13px;color:#888}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;padding:16px}

.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:12px}
.wa-preview{background:#e8f9f0;border-radius:10px;padding:14px;font-size:13px;color:#1a4a30;line-height:1.7;margin:12px 0;white-space:pre-line;border:1px solid #c0e8d0}
.modal-actions{display:flex;gap:8px;margin-top:12px}

<body>
<div class="header">
  <h1>🐾 Cartão Fidelidade</h1>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="sync-btn" onclick="sincronizar()">🔄 Sincronizar</button>
    <span class="sync-badge syncing" id="sync-badge">⏳ Carregando...</span>
  </div>
</div>
<div class="tabs">
  <button class="tab active" onclick="showScreen('dashboard')">📊 Painel</button>
  <button class="tab" onclick="showScreen('clientes')">👥 Clientes</button>
  <button class="tab" onclick="showScreen('registrar')">➕ Registrar</button>
  <button class="tab" onclick="showScreen('premios')">🎁 Prêmios</button>
  <button class="tab" onclick="showScreen('crm')">📡 CRM</button>
</div>
<div id="screen-dashboard" class="screen active">
  <div class="metrics" id="metrics"><div class="loading">Carregando...</div></div>
  <div class="card"><p class="section-title">🎁 Prêmios para resgatar</p><div id="premios-disponiveis" class="client-list"></div></div>
  <div class="card"><p class="section-title">🔥 Próximos do prêmio (faltam 1-2)</p><div id="quase-la" class="client-list"></div></div>
</div>
<div id="screen-clientes" class="screen">

    <button class="filter-btn" onclick="setFilter('Rancho',this)">Cel. Rancho</button>

  <div class="pagination" id="pagination"></div>
</div>
<div id="screen-registrar" class="screen">

    <p class="section-title">Novo cadastro</p>

          <option value="Daniel">Celular do Daniel</option>
          <option value="Matheus">Celular do Matheus</option>

      </div>

        <select id="reg-tipo">

          <option value="20">20 pacotes → 21º grátis</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" onclick="cadastrarCliente()">Cadastrar cliente</button>
    <div id="msg-cadastro" class="msg"></div>
  </div>
  <div class="card">
    <p class="section-title">Registrar compra</p>
    <div class="field-row">
      <div class="field"><label>Buscar cliente</label><input id="comp-busca" type="text" placeholder="Nome ou telefone..." oninput="buscarClienteCompra()"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Data da compra</label><input id="comp-data" type="date"></div>
      <div class="field"><label>Qtd de pacotes</label><input id="comp-qtd" type="number" min="1" max="20" value="1"></div>
    </div>
    <div id="comp-resultados" style="margin-bottom:10px"></div>
    <div id="msg-compra" class="msg"></div>
  </div>
</div>
<div id="screen-premios" class="screen">
  <div class="card">
    <p class="section-title">Resgatar prêmio</p>
    <div class="field-row"><div class="field"><label>Buscar cliente</label><input id="premio-busca" type="text" placeholder="Nome ou telefone..." oninput="buscarClientePremio()"></div></div>
    <div id="premio-resultados"></div>
    <div id="msg-premio" class="msg"></div>
  </div>
</div>
<div id="screen-crm" class="screen">
  <div class="card">
    <p class="section-title">📡 Radar de recompra</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="filter-btn active" onclick="setCrmFilter('todos',this)">Todos</button>
      <button class="filter-btn" onclick="setCrmFilter('verde',this)">🟢 Em dia</button>
      <button class="filter-btn" onclick="setCrmFilter('amarelo',this)">🟡 Atenção</button>
      <button class="filter-btn" onclick="setCrmFilter('vermelho',this)">🔴 Em risco</button>
      <button class="filter-btn" onclick="setCrmFilter('perdido',this)">⚫ Perdido</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <label style="font-size:12px;color:#666">Faixas:</label>

      <button class="btn btn-primary" style="font-size:12px;padding:6px 12px" onclick="renderCRM()">Aplicar</button>
    </div>
    <div id="crm-metricas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px"></div>
    <div id="crm-lista" class="client-list"></div>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <p class="modal-title" id="modal-title"></p>
    <div class="wa-preview" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="copiarMsg()">📋 Copiar</button>
      <button class="btn" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>

function badge(txt,cls){ const b=document.getElementById('sync-badge'); b.textContent=txt; b.className='sync-badge '+(cls||''); }
function showMsg(el,txt,tipo){ el.textContent=txt; el.className='msg show msg-'+tipo; setTimeout(()=>el.classList.remove('show'),4000); }
function gerarId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ── CARREGAR DO FIREBASE ────────────────────────────────
async function carregarDoFirebase(){
  const snap = await getDocs(col);
  clientes = snap.docs.map(d=>({id:d.id,...d.data()}));
}

// ── INICIALIZAR ─────────────────────────────────────────
async function init(){
  try {
    badge('⏳ Verificando...','syncing');
    await carregarDoFirebase();
    // Import missing
    const existentes = new Set(clientes.map(c=>c.id));
    const faltantes = DADOS.filter(c=>!existentes.has(c.id));
    if(faltantes.length){
      const LOTE=40; let done=0;
      for(let i=0;i<faltantes.length;i+=LOTE){
        const b2=writeBatch(db);
        faltantes.slice(i,i+LOTE).forEach(c=>b2.set(doc(db,'clientes',c.id),c));
        await b2.commit();
        done+=Math.min(LOTE,faltantes.length-i);
        badge(`⏳ ${done}/${faltantes.length} importados...`,'syncing');
        await sleep(200);
      }
      await carregarDoFirebase();
    }
    badge('🟢 Online','');
    renderDashboard(); renderClientes();
  } catch(e){ badge('🔴 '+e.message,'offline'); }
}

// ── SINCRONIZAR (botão manual) ──────────────────────────
async function sincronizar(){
  try {
    badge('⏳ Sincronizando...','syncing');
    await carregarDoFirebase();
    badge('🟢 Online','');
    renderDashboard(); renderClientes();
  } catch(e){ badge('🔴 Erro','offline'); }
}

// ── NAVEGAÇÃO ───────────────────────────────────────────
function showScreen(s){
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  ['dashboard','clientes','registrar','premios','crm'].forEach((n,i)=>{
    if(n===s) document.querySelectorAll('.tab')[i].classList.add('active');
  });
  if(s==='dashboard') renderDashboard();
  if(s==='clientes') renderClientes();
  if(s==='crm') renderCRM();
}
function setFilter(f,el){ filterAtivo=f; currentPage=1; document.querySelectorAll('#screen-clientes .filter-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderClientes(); }
function setCrmFilter(f,el){ crmFilter=f; document.querySelectorAll('#screen-crm .filter-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderCRM(); }

// ── RENDER ──────────────────────────────────────────────
function getFiltered(){
  const q=(document.getElementById('search-input')?.value||'').trim().toLowerCase();
  return clientes.filter(c=>{
    if(filterAtivo!=='todos'&&(c.contato||'')!==filterAtivo) return false;
    if(q&&!c.nome.toLowerCase().includes(q)&&!c.tel.includes(q)&&!(c.racao||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function clienteCard(c,modo){
  const meta=parseInt(c.tipo||'10'), pct=Math.min(100,Math.round(c.pontos/meta*100)), pronto=c.pontos>=meta;
  const hist=(c.historico||[]).slice(-2).reverse().map(h=>`<div class="history-item"><span>${h.tipo==='compra'?'+1 pacote':'🎁 Prêmio'}</span><span>${h.data}</span></div>`).join('');
  let acoes='';
  if(modo==='compra') acoes=`<button class="btn btn-success" onclick="registrarCompra('${c.id}')">+1 pacote</button>`;
  else if(modo==='premio') acoes=pronto?`<button class="btn btn-success" onclick="resgatarPremio('${c.id}')">🎁 Resgatar</button>`:`<span style="font-size:13px;color:#aaa">Faltam ${meta-c.pontos}</span>`;
  else acoes=`<button class="btn btn-success" onclick="registrarCompra('${c.id}')">+1</button>
    <button class="btn" onclick="abrirWA('${c.id}')" style="font-size:12px;padding:6px 10px">📱 WA</button>
    <button class="btn btn-danger" onclick="removerCliente('${c.id}')">🗑</button>`;
  return `<div class="client-item">
    <div class="client-header">
      <div>
        <div class="client-name">${c.nome}</div>
        <div class="client-phone">${c.tel}</div>
        <span class="tag tag-racao" onclick="editarRacao('${c.id}')">${c.racao||'+ ração'} ✏️</span>
        <span class="tag tag-contato">📱 ${c.contato||'Paiol'}</span>
      </div>
      <span class="prize-badge ${pronto?'prize-ready':''}">${pronto?'🎁 PRÊMIO!':c.pontos+'/'+meta}</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    ${hist?`<div style="margin-top:4px">${hist}</div>`:''}
    <div class="actions-row">${acoes}</div>
  </div>`;
}

function renderClientes(){
  const lista=getFiltered(), pages=Math.max(1,Math.ceil(lista.length/PER_PAGE));
  if(currentPage>pages) currentPage=pages;
  const slice=lista.slice((currentPage-1)*PER_PAGE,currentPage*PER_PAGE);
  document.getElementById('lista-clientes').innerHTML=slice.length?slice.map(c=>clienteCard(c,'lista')).join(''):`<div class="empty">Nenhum cliente.</div>`;
  const pg=document.getElementById('pagination');
  if(pages<=1){pg.innerHTML='';return;}
  let h=`<span class="page-info">${lista.length} clientes</span>`;
  if(currentPage>1) h+=`<button class="page-btn" onclick="currentPage--;renderClientes()">‹</button>`;
  h+=`<button class="page-btn active">${currentPage}/${pages}</button>`;
  if(currentPage<pages) h+=`<button class="page-btn" onclick="currentPage++;renderClientes()">›</button>`;
  pg.innerHTML=h;
}

function renderDashboard(){
  const total=clientes.length, prontos=clientes.filter(c=>c.pontos>=parseInt(c.tipo||'10')).length;
  const cel={Paiol:0,Rancho:0,Daniel:0,Matheus:0};
  clientes.forEach(c=>{if(cel[c.contato]!==undefined)cel[c.contato]++;});
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Total</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">Prêmios 🎁</div><div class="metric-value">${prontos}</div></div>
    <div class="metric"><div class="metric-label">Paiol</div><div class="metric-value">${cel.Paiol}</div></div>
    <div class="metric"><div class="metric-label">Rancho</div><div class="metric-value">${cel.Rancho}</div></div>
    <div class="metric"><div class="metric-label">Daniel</div><div class="metric-value">${cel.Daniel}</div></div>
    <div class="metric"><div class="metric-label">Matheus</div><div class="metric-value">${cel.Matheus}</div></div>`;
  document.getElementById('premios-disponiveis').innerHTML=clientes.filter(c=>c.pontos>=parseInt(c.tipo||'10')).map(c=>clienteCard(c,'lista')).join('')||`<div class="empty">Nenhum.</div>`;
  const quase=clientes.filter(c=>{const m=parseInt(c.tipo||'10');return c.pontos>=m-2&&c.pontos<m;});
  document.getElementById('quase-la').innerHTML=quase.map(c=>clienteCard(c,'lista')).join('')||`<div class="empty">Ninguém.</div>`;
}

// ── AÇÕES ───────────────────────────────────────────────
async function cadastrarCliente(){
  const nome=document.getElementById('reg-nome').value.trim();
  const tel=document.getElementById('reg-tel').value.trim();
  const msg=document.getElementById('msg-cadastro');
  if(!nome||!tel){showMsg(msg,'Preencha nome e WhatsApp.','info');return;}
  const novo={id:gerarId(),nome,tel,
    contato:document.getElementById('reg-contato').value,
    racao:document.getElementById('reg-racao').value.trim(),
    tipo:document.getElementById('reg-tipo').value,
    pontos:0,historico:[],resgates:0,
    cadastro:new Date().toLocaleDateString('pt-BR')};
  await setDoc(doc(db,'clientes',novo.id),novo);
  clientes.push(novo); // update local array
  renderDashboard(); renderClientes();
  showMsg(msg,`${nome} cadastrado!`,'success');
  document.getElementById('reg-nome').value='';
  document.getElementById('reg-tel').value='';
  document.getElementById('reg-racao').value='';
  gerarWA(novo,'cadastro');
}

async function registrarCompra(id){
  const idx=clientes.findIndex(x=>x.id===id); if(idx<0) return;
  const c=clientes[idx], meta=parseInt(c.tipo||'10');
  const di=document.getElementById('comp-data').value;
  const dataFmt=di?di.split('-').reverse().join('/'):new Date().toLocaleDateString('pt-BR');
  const qtd=Math.max(1,Math.min(20,parseInt(document.getElementById('comp-qtd').value)||1));
  const upd={...c,historico:[...(c.historico||[])]};
  let n=0;
  for(let i=0;i<qtd;i++){
    if(upd.pontos>=meta){if(i===0){alert('Prêmio pendente! Resgate primeiro.');return;}break;}
    upd.pontos++; upd.historico.push({data:dataFmt,tipo:'compra'}); n++;
  }
  await setDoc(doc(db,'clientes',id),upd);
  clientes[idx]=upd; // update local array
  buscarClienteCompra(); renderDashboard();
  showMsg(document.getElementById('msg-compra'),`+${n} pacote${n>1?'s':''} para ${c.nome}. Saldo: ${upd.pontos}/${meta}`,'success');
  gerarWA(upd,'compra');
}

async function resgatarPremio(id){
  const idx=clientes.findIndex(x=>x.id===id); if(idx<0) return;
  const c=clientes[idx], meta=parseInt(c.tipo||'10');
  if(c.pontos<meta){alert('Ainda não atingiu a meta.');return;}
  const upd={...c,pontos:0,resgates:(c.resgates||0)+1,
    historico:[...(c.historico||[]),{data:new Date().toLocaleDateString('pt-BR'),tipo:'resgate'}]};
  await setDoc(doc(db,'clientes',id),upd);
  clientes[idx]=upd; // update local array
  buscarClientePremio(); renderDashboard();
  showMsg(document.getElementById('msg-premio'),`Prêmio resgatado para ${c.nome}!`,'success');
  gerarWA(upd,'resgate');
}

async function removerCliente(id){
  const idx=clientes.findIndex(x=>x.id===id); if(idx<0) return;
  const nome=clientes[idx].nome;
  if(!confirm(`Remover ${nome}?`)) return;
  try {
    badge('⏳ Removendo...','syncing');
    // 1. Deleta no Firebase PRIMEIRO e aguarda confirmação
    await deleteDoc(doc(db,'clientes',id));
    // 2. Só remove localmente após confirmação do Firebase
    clientes.splice(idx,1);
    renderClientes(); renderDashboard();
    badge('🟢 Online','');
  } catch(e){
    badge('🟢 Online','');
    alert('Erro ao remover: '+e.message);
  }
}

async function editarRacao(id){
  const idx=clientes.findIndex(x=>x.id===id); if(idx<0) return;
  const nova=prompt(`Ração de ${clientes[idx].nome}:`,clientes[idx].racao||'');
  if(nova===null) return;
  clientes[idx]={...clientes[idx],racao:nova.trim()};
  await setDoc(doc(db,'clientes',id),clientes[idx]);
  renderClientes();
}

function abrirWA(id){ const c=clientes.find(x=>x.id===id); if(c) gerarWA(c,'compra'); }

function gerarWA(c,tipo){
  const meta=parseInt(c.tipo||'10'), premio=meta===10?'50% de desconto no próximo pacote':'um pacote grátis', nome=c.nome.split(' ')[0];
  let txt='';
  if(tipo==='cadastro') txt=`Olá, ${nome}! 🐾

Bem-vindo ao cartão fidelidade!

A cada ${meta} pacotes, você ganha ${premio}.

Saldo: 0/${meta} pacotes.

Obrigado! 😊`;
  else if(tipo==='compra'){
    const f=meta-c.pontos;
    txt=f<=0?`Olá, ${nome}! 🎉

Cartão completo! Você ganhou ${premio}!

Na próxima visita é só avisar. 🐾`
           :`Olá, ${nome}! 🐾

Compra registrada!

Saldo: ${c.pontos}/${meta}. Faltam ${f} para ganhar ${premio}!

Obrigado! 😊`;
  } else txt=`Olá, ${nome}! 🎉

Prêmio resgatado! Cartão zerado.

A cada ${meta} pacotes você ganha ${premio}.

Obrigado! 🐾`;
  abrirModal('Copiar para WhatsApp',txt);
}

function buscarClienteCompra(){
  const q=document.getElementById('comp-busca').value.trim().toLowerCase(), el=document.getElementById('comp-resultados');
  if(!q){el.innerHTML='';return;}
  const res=clientes.filter(c=>c.nome.toLowerCase().includes(q)||c.tel.includes(q));
  el.innerHTML=res.length?res.slice(0,5).map(c=>clienteCard(c,'compra')).join(''):`<p style="color:#aaa;font-size:13px;padding:8px 0">Nenhum encontrado.</p>`;
}

function buscarClientePremio(){
  const q=document.getElementById('premio-busca').value.trim().toLowerCase(), el=document.getElementById('premio-resultados');
  if(!q){el.innerHTML='';return;}
  const res=clientes.filter(c=>c.nome.toLowerCase().includes(q)||c.tel.includes(q));
  el.innerHTML=res.length?res.slice(0,5).map(c=>clienteCard(c,'premio')).join(''):`<p style="color:#aaa;font-size:13px;padding:8px 0">Nenhum encontrado.</p>`;
}

// ── CRM ─────────────────────────────────────────────────
function diasDesde(d){ if(!d)return 9999; const p=d.split('/'); if(p.length<3)return 9999; const r=Math.floor((Date.now()-new Date(+p[2],+p[1]-1,+p[0]))/(86400000)); return isNaN(r)?9999:r; }
function ultimaCompra(c){ const h=(c.historico||[]).filter(x=>x.tipo==='compra'); return h.length?h[h.length-1].data:null; }
function freqMedia(c){ const h=(c.historico||[]).filter(x=>x.tipo==='compra'); if(h.length<2)return null; const ds=h.map(x=>{const p=x.data.split('/');return new Date(+p[2],+p[1]-1,+p[0]).getTime();}).sort((a,b)=>a-b); let t=0; for(let i=1;i<ds.length;i++)t+=ds[i]-ds[i-1]; return Math.round(t/(ds.length-1)/86400000); }
function semCor(d,d1,d2,d3){ return d===9999?'perdido':d<=d1?'verde':d<=d2?'amarelo':d<=d3?'vermelho':'perdido'; }
function semIcon(c){ return{verde:'🟢',amarelo:'🟡',vermelho:'🔴',perdido:'⚫'}[c]; }
function msgCRM(c,cor){
  const r=c.racao||'ração', n=c.nome.split(' ')[0];
  return{
    verde:`Olá, ${n}! 🐾

Tudo bem com seu pet? A ${r} está disponível. Qualquer coisa é só chamar! 😊`,
    amarelo:`Olá, ${n}! 🐾

Já faz um tempinho! A ${r} pode estar acabando. Quer que a gente separe? 😊`,
    vermelho:`Olá, ${n}! 🐾

Sentimos sua falta! A ${r} está no estoque e seu cartão tem ${c.pontos} ponto${c.pontos!==1?'s':''}. 😊`,
    perdido:`Olá, ${n}! 🐾

Faz muito tempo! Você tem ${c.pontos} ponto${c.pontos!==1?'s':''} esperando. Que tal passar? 😊`
  }[cor]||'';
}

function renderCRM(){
  const d1=+document.getElementById('crm-d1').value||20, d2=+document.getElementById('crm-d2').value||35, d3=+document.getElementById('crm-d3').value||60;
  const dados=clientes.map(c=>({...c,dias:diasDesde(ultimaCompra(c)),freq:freqMedia(c),totalCompras:(c.historico||[]).filter(h=>h.tipo==='compra').length})).filter(c=>c.totalCompras>0);
  dados.forEach(c=>c.cor=semCor(c.dias,d1,d2,d3));
  const cnt={verde:0,amarelo:0,vermelho:0,perdido:0}; dados.forEach(c=>cnt[c.cor]++);
  document.getElementById('crm-metricas').innerHTML=`
    <div class="metric"><div class="metric-label">🟢 Em dia</div><div class="metric-value">${cnt.verde}</div></div>
    <div class="metric"><div class="metric-label">🟡 Atenção</div><div class="metric-value">${cnt.amarelo}</div></div>
    <div class="metric"><div class="metric-label">🔴 Em risco</div><div class="metric-value">${cnt.vermelho}</div></div>
    <div class="metric"><div class="metric-label">⚫ Perdido</div><div class="metric-value">${cnt.perdido}</div></div>`;
  const fil=(crmFilter==='todos'?dados:dados.filter(c=>c.cor===crmFilter)).sort((a,b)=>b.dias-a.dias);
  const bg={verde:'#e8f9f0',amarelo:'#fffbe6',vermelho:'#fff5f5',perdido:'#f0f0f0'};
  const tx={verde:'#0F6E56',amarelo:'#7a5c00',vermelho:'#a32d2d',perdido:'#666'};
  // Store CRM messages in cache to avoid inline escaping issues
  window._crmMsgs = {};
  fil.forEach(c => { window._crmMsgs[c.id] = {nome: c.nome, msg: msgCRM(c,c.cor)}; });

  document.getElementById('crm-lista').innerHTML=fil.length?fil.map(c=>{
    const dt=c.dias===9999?'Sem compras':c.dias===0?'Hoje':c.dias===1?'Ontem':`Há ${c.dias} dias`;
    return `<div class="client-item">
      <div class="client-header">
        <div>
          <div class="client-name">${semIcon(c.cor)} ${c.nome}</div>
          <div class="client-phone">${c.tel}</div>
          ${c.racao?`<span class="tag tag-racao">${c.racao}</span>`:''}
          <span class="tag tag-contato">📱 ${c.contato||'Paiol'}</span>
        </div>
        <div style="text-align:right">
          <span style="font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;background:${bg[c.cor]};color:${tx[c.cor]};display:block;margin-bottom:4px">${dt}</span>
          <span style="font-size:11px;color:#888">${c.totalCompras} compra${c.totalCompras!==1?'s':''}</span>
        </div>
      </div>
      <div style="font-size:12px;color:#888;margin:4px 0 8px">${c.freq?`Recompra média: ${c.freq} dias`:'1ª compra'} · ${c.pontos}/${c.tipo||10} pts</div>
      <button class="btn btn-success" onclick="abrirCrmMsg('${c.id}')">📱 Mensagem WA</button>
    </div>`;
  }).join(''):`<div class="empty">Nenhum cliente nesta categoria.</div>`;
}


function abrirCrmMsg(id){
  const data = window._crmMsgs && window._crmMsgs[id];
  if(!data) return;
  abrirModal('Mensagem para '+data.nome, data.msg);
}

// ── MODAL ────────────────────────────────────────────────
function abrirModal(t,b){ document.getElementById('modal-title').textContent=t; document.getElementById('modal-body').textContent=b; document.getElementById('modal-overlay').classList.add('open'); }
function fecharModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharModal();});
function copiarMsg(){ navigator.clipboard.writeText(document.getElementById('modal-body').textContent).then(fecharModal).catch(()=>alert('Copie manualmente.')); }

// ── EXPOR AO WINDOW ──────────────────────────────────────
Object.assign(window,{showScreen,setFilter,setCrmFilter,renderClientes,renderCRM,renderDashboard,abrirCrmMsg,
  cadastrarCliente,registrarCompra,resgatarPremio,removerCliente,editarRacao,
  abrirWA,buscarClienteCompra,buscarClientePremio,abrirModal,fecharModal,copiarMsg,sincronizar});

document.getElementById('comp-data').value=new Date().toISOString().split('T')[0];
init();
</script>
